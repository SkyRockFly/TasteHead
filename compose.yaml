services:
    db-tastehead:
      image: postgres:16
      environment:
        POSTGRES_PASSWORD: bear
        POSTGRES_DB: tasteheaddb
      ports:
        - "5432:5432"
      volumes:
        - "pgdata_tastehead:/var/lib/postgresql/data"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d tasteheaddb"]
        interval: 5s
        timeout: 3s
        retries: 5
    migrate-tasteheaddb:
      image: ghcr.io/kukymbr/goose-docker:3.24.3
      depends_on:
        db-tastehead:
          condition: service_healthy
      volumes:
        - ./migrations:/migrations:ro
      entrypoint: ["goose", "-dir", "/migrations", "up-to", "4"]
      environment:
        GOOSE_DRIVER: postgres
        GOOSE_DBSTRING: postgres://postgres:bear@db-tastehead:5432/tasteheaddb?sslmode=disable
        GOOSE_MIGRATION_DIR: /migrations
      

volumes:
  pgdata_tastehead:
